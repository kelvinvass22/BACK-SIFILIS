<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha - App Sífilis 60+</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #a35fbf; margin-bottom: 20px; }
        p { color: #666; font-size: 16px; margin-bottom: 25px; }
        input[type="password"] { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 18px; }
        button { background-color: #a35fbf; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #8e4fa5; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Criar Nova Senha</h2>
        <p>Olá! Digite sua nova senha abaixo para acessar o aplicativo novamente.</p>
        
        <form method="POST" action="/api/accounts/password/reset/confirm/">
            {% csrf_token %}
            <!-- Campos escondidos para o idoso não precisar mexer -->
            <input type="hidden" name="uid" value="{{ uid }}">
            <input type="hidden" name="token" value="{{ token }}">
            
            <input type="password" name="new_password1" placeholder="Digite a nova senha" required>
            <input type="password" name="new_password2" placeholder="Repita a nova senha" required>
            
            <button type="submit">GRAVAR NOVA SENHA</button>
        </form>
    </div>
</body>
</html>
